name: CI

on:
  push:
    branches: [main]
  pull_request:

# One active run per workflow+ref (PR or branch). Newer pushes cancel older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: read-only unless a job needs more.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ev_telemetry_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ev_telemetry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/ev_telemetry_test
      API_KEY_HASH_SECRET: ci-api-key-hash-secret-32characters!
      APP_ENV: test
      ALLOW_MOCK_ADAPTERS: 'true'
      NEXT_PUBLIC_APP_NAME: EV Telemetry Dashboard (CI)
      NEXT_PUBLIC_APP_ENV: test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_ARC_EXPLORER_BASE_URL: https://explorer.test.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Drizzle migration consistency
        run: pnpm db:check

      - name: Apply migrations (test database)
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: OpenAPI drift check
        run: pnpm openapi:check

      - name: Build
        run: pnpm build

      - name: Install Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

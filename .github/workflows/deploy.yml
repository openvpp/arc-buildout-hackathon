name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  droplet:
    name: Deploy to DigitalOcean droplet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/ev-telemetry

            # Droplet must authenticate to GitHub on its own (deploy key / HTTPS).
            git remote set-url origin git@github.com:openvpp/arc-buildout-hackathon.git
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main

            chmod +x scripts/deploy-droplet.sh
            bash scripts/deploy-droplet.sh

name: Deploy

on:
  push:
    branches: [main]

concurrency:
  # Serialize deploys on main. Do not cancel mid-run — rsync/build on the
  # droplet can leave a bad tree if interrupted. Newer pushes wait in queue.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  droplet:
    name: Deploy to DigitalOcean droplet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printenv preserves multiline OpenSSH private keys safely
          printenv DEPLOY_SSH_KEY > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync repository to droplet
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.*.local' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'coverage/' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/ev-telemetry/"

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/ev-telemetry
            chmod +x scripts/deploy-droplet.sh
            bash scripts/deploy-droplet.sh

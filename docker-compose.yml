services:
  postgres:
    image: postgres:16-alpine
    container_name: ev-telemetry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ev_telemetry
    ports:
      - '5432:5432'
    volumes:
      - ev_telemetry_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ev_telemetry']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres_test:
    image: postgres:16-alpine
    container_name: ev-telemetry-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ev_telemetry_test
    ports:
      - '5433:5432'
    volumes:
      - ev_telemetry_pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ev_telemetry_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ev_telemetry_pgdata:
  ev_telemetry_pgdata_test:

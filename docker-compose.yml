services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arc_buildout
      POSTGRES_PASSWORD: arc_buildout
      POSTGRES_DB: arc_buildout
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arc_buildout']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
